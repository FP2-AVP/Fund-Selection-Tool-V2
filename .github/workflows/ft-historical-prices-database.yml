name: Build FT Historical Prices Database
run-name: >-
  FT ${{ inputs.job_kind || 'manual' }}${{ inputs.job_id && format(' · {0}', inputs.job_id) || '' }}

on:
  schedule:
    # Monthly qualitative refresh: 20:00 UTC on the 1st = 03:00 Bangkok on the 2nd.
    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter label, used for artifact naming."
        required: true
        default: "2026-Q1"
      symbol:
        description: "FT Markets symbol, e.g. IXN:PCQ:USD"
        required: false
        default: "IXN:PCQ:USD"
      symbols:
        description: "Optional comma/newline separated FT symbols for batch sync."
        required: false
        default: ""
      all_symbols_from_db:
        description: "Batch sync every symbol already present in the downloaded FT SQLite database."
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      ft_url:
        description: "Original FT.com URL, kept for logs."
        required: false
        default: ""
      start_date:
        description: "Historical price start date, YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Historical price end date, YYYY-MM-DD"
        required: false
        default: ""
      run_prices:
        description: "Fetch historical price rows"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_qualitative:
        description: "Fetch profile/risk/holdings qualitative rows"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      drive_folder_id:
        description: "Google Drive folder id for ft_historical_prices_database.json"
        required: true
        default: "1Locig3aW7hVs0SxCoeFpa76OJ0XcF1rg"
      file_name:
        description: "Output JSON file name"
        required: true
        default: "ft_historical_prices_database.json"
      app_script_url:
        description: "Apps Script web app URL for saving the output JSON to Drive"
        required: false
        default: ""
      app_script_key:
        description: "Apps Script API key"
        required: false
        default: ""
      continue_on_error:
        description: "Continue batch sync even if one symbol fails."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      sleep_seconds:
        description: "Delay between symbols during batch sync."
        required: false
        default: "1"
      job_id:
        description: "Job id supplied by the Cloudflare FT job runner."
        required: false
        default: ""
      job_kind:
        description: "Job type supplied by the Cloudflare FT job runner."
        required: false
        default: ""

jobs:
  build-ft-historical-prices-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EFFECTIVE_QUARTER: ${{ inputs.quarter || '2026-Q1' }}
      EFFECTIVE_SYMBOL: ${{ inputs.symbol || 'IXN:PCQ:USD' }}
      EFFECTIVE_SYMBOLS: ${{ inputs.symbols || '' }}
      EFFECTIVE_DRIVE_FOLDER_ID: ${{ inputs.drive_folder_id || '1Locig3aW7hVs0SxCoeFpa76OJ0XcF1rg' }}
      EFFECTIVE_FILE_NAME: ${{ inputs.file_name || 'ft_historical_prices_database.json' }}
      EFFECTIVE_APP_SCRIPT_URL: ${{ inputs.app_script_url || secrets.FT_HISTORICAL_APP_SCRIPT_URL }}
      EFFECTIVE_APP_SCRIPT_KEY: ${{ inputs.app_script_key || secrets.FT_HISTORICAL_APP_SCRIPT_KEY }}
      EFFECTIVE_SLEEP_SECONDS: ${{ inputs.sleep_seconds || '1' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show sync plan
        run: |
          echo "quarter=${EFFECTIVE_QUARTER}"
          echo "symbol=${EFFECTIVE_SYMBOL}"
          echo "symbols=${EFFECTIVE_SYMBOLS}"
          echo "all_symbols_from_db=${{ github.event_name == 'schedule' && 'true' || inputs.all_symbols_from_db }}"
          echo "ft_url=${{ inputs.ft_url }}"
          echo "run_prices=${{ github.event_name == 'schedule' && 'false' || inputs.run_prices }}"
          echo "run_qualitative=${{ github.event_name == 'schedule' && 'true' || inputs.run_qualitative }}"
          echo "start_date=${{ inputs.start_date }}"
          echo "end_date=${{ inputs.end_date }}"

      - name: Prepare clean FT output folder
        run: |
          rm -rf Data/ft_historical_prices
          mkdir -p Data/ft_historical_prices

      - name: Download existing FT SQLite from Google Drive
        if: ${{ env.EFFECTIVE_APP_SCRIPT_URL != '' }}
        run: |
          python scripts/download_ft_historical_artifact_from_apps_script.py \
            --url "${EFFECTIVE_APP_SCRIPT_URL}" \
            --key "${EFFECTIVE_APP_SCRIPT_KEY}" \
            --folder-id "${EFFECTIVE_DRIVE_FOLDER_ID}" \
            --relative-path "ft_historical_prices.sqlite" \
            --output "Data/ft_historical_prices/ft_historical_prices.sqlite" \
            --optional

      - name: Verify existing FT SQLite before mutation
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("Data/ft_historical_prices/ft_historical_prices.sqlite")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit(
                  "Existing FT SQLite was not downloaded. Configure FT_HISTORICAL_APP_SCRIPT_URL "
                  "before running a job; refusing to overwrite the R2 index with a partial database."
              )
          with sqlite3.connect(path) as conn:
              tables = {row[0] for row in conn.execute("select name from sqlite_master where type='table'")}
              expected = {
                  "ft_historical_prices", "ft_profile_investment", "ft_performance_measures",
                  "ft_risk_measures", "ft_top_holdings",
              }
              available = sorted(tables & expected)
              if not available:
                  raise SystemExit("Existing FT SQLite has no recognized FT tables; refusing to continue.")
              unions = " union ".join(f"select symbol from {table}" for table in available)
              symbol_count = conn.execute(f"select count(*) from ({unions})").fetchone()[0]
              if symbol_count < 1:
                  raise SystemExit("Existing FT SQLite has zero symbols; refusing to continue.")
          print(f"Verified existing FT SQLite: {symbol_count} symbols")
          PY

      - name: Sync FT historical prices
        if: ${{ github.event_name != 'schedule' && inputs.run_prices == 'true' }}
        run: |
          extra_args=()
          if [ "${{ inputs.all_symbols_from_db }}" = "true" ]; then
            extra_args+=(--all-symbols-from-db)
          fi
          if [ "${{ inputs.continue_on_error }}" = "true" ]; then
            extra_args+=(--continue-on-error)
          fi
          python scripts/ft_historical_prices_store.py \
            --symbol "${EFFECTIVE_SYMBOL}" \
            --symbols "${EFFECTIVE_SYMBOLS}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --sleep-seconds "${EFFECTIVE_SLEEP_SECONDS}" \
            "${extra_args[@]}"

      - name: Sync FT qualitative data
        if: ${{ github.event_name == 'schedule' || inputs.run_qualitative == 'true' }}
        run: |
          extra_args=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.all_symbols_from_db }}" = "true" ]; then
            extra_args+=(--all-symbols-from-db)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.continue_on_error }}" = "true" ]; then
            extra_args+=(--continue-on-error)
          fi
          python scripts/ft_historical_prices_store.py \
            --symbol "${EFFECTIVE_SYMBOL}" \
            --symbols "${EFFECTIVE_SYMBOLS}" \
            --qualitative-only \
            --sleep-seconds "${EFFECTIVE_SLEEP_SECONDS}" \
            "${extra_args[@]}"

      - name: Export FT database JSON
        run: |
          python scripts/ft_historical_prices_store.py \
            --export-json \
            --output "Data/ft_historical_prices/exports/${EFFECTIVE_FILE_NAME}"

      - name: Export and upload sharded FT data to Cloudflare R2
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_R2_ACCESS_KEY_ID != '' && env.CLOUDFLARE_R2_SECRET_ACCESS_KEY != '' && env.CLOUDFLARE_R2_BUCKET != '' }}
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.92
          python scripts/sync_ft_r2.py --upload

      - name: Upload FT database JSON via Apps Script
        if: ${{ env.EFFECTIVE_APP_SCRIPT_URL != '' }}
        run: |
          python scripts/upload_ft_historical_database_to_apps_script.py \
            --url "${EFFECTIVE_APP_SCRIPT_URL}" \
            --key "${EFFECTIVE_APP_SCRIPT_KEY}" \
            --input "Data/ft_historical_prices/exports/${EFFECTIVE_FILE_NAME}" \
            --folder-id "${EFFECTIVE_DRIVE_FOLDER_ID}" \
            --file-name "${EFFECTIVE_FILE_NAME}"

      - name: Upload FT SQLite CSV and raw artifacts via Apps Script
        if: ${{ env.EFFECTIVE_APP_SCRIPT_URL != '' }}
        run: |
          python scripts/upload_ft_historical_artifacts_to_apps_script.py \
            --url "${EFFECTIVE_APP_SCRIPT_URL}" \
            --key "${EFFECTIVE_APP_SCRIPT_KEY}" \
            --root "Data/ft_historical_prices" \
            --folder-id "${EFFECTIVE_DRIVE_FOLDER_ID}"

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: ft-historical-prices-database-${{ env.EFFECTIVE_QUARTER }}
          path: Data/ft_historical_prices/exports/${{ env.EFFECTIVE_FILE_NAME }}
          if-no-files-found: error
