name: SEC Data Preparation to Google Sheet

on:
  workflow_dispatch:
    inputs:
      tab_name:
        description: "Target Google Sheet tab name"
        required: true
        default: "data_preparation"
      output_spreadsheet_id:
        description: "Destination Google Sheet ID or URL for data_preparation output"
        required: false
        default: "1SsL8fXFmKsAfnakrIBTtglZqhErrYz8SfiiZb4wKGDs"
      dataset_preset:
        description: "Preset endpoints to summarize into data_preparation"
        required: true
        default: "master_core"
        type: choice
        options:
          - "master_core"
          - "all_master"
          - "daily"
          - "weekly"
      custom_datasets:
        description: "Optional comma-separated dataset keys. If set, overrides preset."
        required: false
        default: ""
      output_mode:
        description: "Write summarized data_preparation or raw endpoint tabs"
        required: true
        default: "raw_tabs"
        type: choice
        options:
          - "raw_tabs"
          - "data_preparation"
          - "master_from_raw"
      proj_id:
        description: "Optional single SEC project id for testing"
        required: false
        default: ""
      proj_ids:
        description: "Optional multiple SEC project ids separated by comma, space, or newline"
        required: false
        default: ""
      proj_class_pairs:
        description: "Optional proj_id|fund_class_name lines. Leave class blank to fetch all classes."
        required: false
        default: ""
      fund_status:
        description: "Profiles fund_status filter"
        required: true
        default: "Registered"
      use_existing_profiles:
        description: "Read existing 02_profiles from the output spreadsheet instead of fetching profiles again when profiles is not selected"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      registered_max_funds:
        description: "Limit registered funds for testing. Use 0 for no limit."
        required: true
        default: "50"
      fund_class_name:
        description: "Optional fund_class_name filter"
        required: false
        default: ""
      latest:
        description: "Use latest factsheet data for supported endpoints"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      start_date:
        description: "Factsheet start_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Factsheet end_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      start_period:
        description: "Outstanding data start period, YYYYMM"
        required: false
        default: ""
      end_period:
        description: "Outstanding data end period, YYYYMM"
        required: false
        default: ""
      start_nav_date:
        description: "NAV start date for daily preset, YYYY-MM-DD"
        required: false
        default: ""
      end_nav_date:
        description: "NAV end date for daily preset, YYYY-MM-DD"
        required: false
        default: ""
      max_pages:
        description: "Maximum pages per endpoint. Use 0 for no limit."
        required: true
        default: "1"
      continue_on_error:
        description: "Continue when endpoint returns an error"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  sec-data-preparation-to-google-sheet:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sec.txt

      - name: Build SEC data_preparation and write Google Sheet
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT }}
          SEC_MASTER_VIEW_SPREADSHEET_ID: ${{ secrets.SEC_MASTER_VIEW_SPREADSHEET_ID }}
        run: |
          if [ "${{ inputs.output_mode }}" = "raw_tabs" ]; then
            DATASETS="${{ inputs.custom_datasets }}"
            if [ -z "$DATASETS" ]; then
              case "${{ inputs.dataset_preset }}" in
                all_master) DATASETS="amcs,profiles,specifications,mutual_fund_fees,involve_parties,factsheet_urls,ipos,benchmarks,subscription_redemption_minimums,subscription_redemption_periods,risk_spectrum,statistics,dividend_policy,fees,performance,asset_allocation,top5_holdings,outstanding_portfolio,portfolio_asset_type" ;;
                daily) DATASETS="profiles,nav_daily" ;;
                weekly) DATASETS="profiles,dividend_history" ;;
                *) DATASETS="profiles,factsheet_urls,benchmarks,risk_spectrum,statistics,dividend_policy" ;;
              esac
            fi
            python scripts/sec_raw_tabs_to_sheet.py \
              --spreadsheet-id "${{ inputs.output_spreadsheet_id }}" \
              --datasets "$DATASETS" \
              --proj-id "${{ inputs.proj_id }}" \
              --proj-ids "${{ inputs.proj_ids }}" \
              --proj-class-pairs "${{ inputs.proj_class_pairs }}" \
              --fund-status "${{ inputs.fund_status }}" \
              --use-existing-profiles "${{ inputs.use_existing_profiles }}" \
              --registered-max-funds "${{ inputs.registered_max_funds }}" \
              --fund-class-name "${{ inputs.fund_class_name }}" \
              --latest "${{ inputs.latest }}" \
              --start-date "${{ inputs.start_date }}" \
              --end-date "${{ inputs.end_date }}" \
              --start-period "${{ inputs.start_period }}" \
              --end-period "${{ inputs.end_period }}" \
              --start-nav-date "${{ inputs.start_nav_date }}" \
              --end-nav-date "${{ inputs.end_nav_date }}" \
              --max-pages "${{ inputs.max_pages }}" \
              --continue-on-error "${{ inputs.continue_on_error }}"
          elif [ "${{ inputs.output_mode }}" = "master_from_raw" ]; then
            python scripts/sec_master_view_from_raw_tabs.py \
              --source-spreadsheet-id "${{ inputs.output_spreadsheet_id }}" \
              --spreadsheet-id "${{ inputs.output_spreadsheet_id }}" \
              --output-tab "${{ inputs.tab_name }}"
          else
            python scripts/sec_master_view_to_sheet.py \
              --spreadsheet-id "${{ inputs.output_spreadsheet_id }}" \
              --tab-name "${{ inputs.tab_name }}" \
              --dataset-preset "${{ inputs.dataset_preset }}" \
              --datasets "${{ inputs.custom_datasets }}" \
              --proj-id "${{ inputs.proj_id }}" \
              --proj-ids "${{ inputs.proj_ids }}" \
              --proj-class-pairs "${{ inputs.proj_class_pairs }}" \
              --fund-status "${{ inputs.fund_status }}" \
              --registered-max-funds "${{ inputs.registered_max_funds }}" \
              --fund-class-name "${{ inputs.fund_class_name }}" \
              --latest "${{ inputs.latest }}" \
              --start-date "${{ inputs.start_date }}" \
              --end-date "${{ inputs.end_date }}" \
              --start-period "${{ inputs.start_period }}" \
              --end-period "${{ inputs.end_period }}" \
              --start-nav-date "${{ inputs.start_nav_date }}" \
              --end-nav-date "${{ inputs.end_nav_date }}" \
              --max-pages "${{ inputs.max_pages }}" \
              --continue-on-error "${{ inputs.continue_on_error }}"
          fi
