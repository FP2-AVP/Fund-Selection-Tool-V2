name: Export Google Sheets to Drive JSON

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter tab to export, e.g. 2026-Q3"
        required: true
        default: "2026-Q3"
      dataset:
        description: "Dataset to export"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sec-api
          - fund-key-performance
          - thai-quality
          - master-fund

jobs:
  export-json:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-json-export.txt

      - name: Export JSON for Google Drive and Cloudflare R2
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT }}
          DRIVE_JSON_TARGET_DATA: ${{ secrets.DRIVE_JSON_TARGET_DATA }}
        run: |
          python scripts/export_sheets_to_drive_json.py \
            --quarter "${{ inputs.quarter }}" \
            --dataset "${{ inputs.dataset }}" \
            --output-dir "r2-staging" \
            --drive-upload "optional"

      - name: Sync complete base quarter to Cloudflare R2
        if: ${{ inputs.dataset == 'all' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          python scripts/sync_r2_base.py \
            --quarter "${{ inputs.quarter }}" \
            --source-dir "r2-staging"
