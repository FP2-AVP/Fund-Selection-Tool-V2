name: Export Google Sheets to Drive JSON

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter tab to export, e.g. 2026-Q3"
        required: true
        default: "2026-Q3"
      dataset:
        description: "Dataset to export"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - fund-key-performance
          - thai-quality
          - master-fund

jobs:
  export-json:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-json-export.txt

      - name: Export JSON to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT }}
          DRIVE_JSON_TARGET_DATA: ${{ secrets.DRIVE_JSON_TARGET_DATA }}
        run: |
          python scripts/export_sheets_to_drive_json.py \
            --quarter "${{ inputs.quarter }}" \
            --dataset "${{ inputs.dataset }}"
