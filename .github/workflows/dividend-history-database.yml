name: Build Dividend History Database

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter label, used for logs only."
        required: true
        default: "2026-Q1"
      drive_folder_id:
        description: "Google Drive folder id for dividend_history_database.json"
        required: true
        default: "1SBJshoukb5O9hdTawTtexVQzo4oLfW3u"
      file_name:
        description: "Output JSON file name"
        required: true
        default: "dividend_history_database.json"
      sync_sec:
        description: "Fetch SEC dividend history"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      sync_finnomena:
        description: "Fetch Finnomena dividend history"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-dividend-history-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sec.txt
          pip install -r scripts/requirements-json-export.txt

      - name: Initialize dividend database
        run: |
          python scripts/dividend_history_store.py init-db
          python scripts/dividend_history_store.py import-tracked-funds

      - name: Sync SEC dividend history
        if: ${{ inputs.sync_sec == 'true' }}
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: |
          python scripts/dividend_history_store.py sync --sleep-seconds 0.05

      - name: Sync Finnomena dividend history
        if: ${{ inputs.sync_finnomena == 'true' }}
        run: |
          python scripts/dividend_history_store.py sync-finnomena --workers 12

      - name: Export and upload dividend database JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_EXPORT }}
        run: |
          python scripts/dividend_history_store.py upload-json \
            --drive-folder-id "${{ inputs.drive_folder_id }}" \
            --file-name "${{ inputs.file_name }}"

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: dividend-history-database-${{ inputs.quarter }}
          path: Dividend Database/exports/${{ inputs.file_name }}
          if-no-files-found: error
