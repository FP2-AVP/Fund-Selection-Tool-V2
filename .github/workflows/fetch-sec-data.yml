name: Fetch SEC Data to CSV

on:
  workflow_dispatch:
    inputs:
      proj_id:
        description: "Optional SEC project id. Leave blank to fetch all available funds."
        required: false
        default: ""
      fund_class_name:
        description: "Optional fund_class_name filter"
        required: false
        default: ""
      latest:
        description: "Use latest factsheet data for supported endpoints"
        required: true
        default: "true"
      start_date:
        description: "Factsheet start_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Factsheet end_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      start_period:
        description: "Outstanding data start period, YYYYMM"
        required: false
        default: ""
      end_period:
        description: "Outstanding data end period, YYYYMM"
        required: false
        default: ""
      start_nav_date:
        description: "NAV start date, YYYY-MM-DD"
        required: true
        default: "2023-10-01"
      end_nav_date:
        description: "NAV end date, YYYY-MM-DD"
        required: true
        default: "2023-10-31"
      datasets:
        description: "Comma-separated datasets or all"
        required: true
        default: "all"
      max_pages:
        description: "Maximum pages per endpoint for test run. Use 0 for no limit."
        required: true
        default: "3"
      output_layout:
        description: "flat or latest-snapshot"
        required: true
        default: "latest-snapshot"
      output_group:
        description: "Optional output group folder, such as master, daily, or weekly"
        required: false
        default: ""
      write_curated:
        description: "Write combined curated CSV files"
        required: true
        default: "true"

jobs:
  fetch-sec-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sec.txt

      - name: Fetch SEC API data
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: |
          python scripts/fetch_sec_data.py \
            --output-dir sec_output \
            --proj-id "${{ inputs.proj_id }}" \
            --fund-class-name "${{ inputs.fund_class_name }}" \
            --latest "${{ inputs.latest }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --start-period "${{ inputs.start_period }}" \
            --end-period "${{ inputs.end_period }}" \
            --start-nav-date "${{ inputs.start_nav_date }}" \
            --end-nav-date "${{ inputs.end_nav_date }}" \
            --datasets "${{ inputs.datasets }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --output-layout "${{ inputs.output_layout }}" \
            --output-group "${{ inputs.output_group }}" \
            --write-curated "${{ inputs.write_curated }}"

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-csv-output
          path: sec_output/**/*.csv
          if-no-files-found: error
