name: Fetch SEC Data to CSV

on:
  workflow_dispatch:
    inputs:
      proj_id:
        description: "Optional SEC project id. Leave blank to fetch all available funds."
        required: false
        default: ""
      fund_status:
        description: "Optional fund_status filter for profiles"
        required: false
        default: "Registered"
      registered_only:
        description: "Use Registered profiles as proj_id list for selected project-scoped dataset"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      registered_max_funds:
        description: "Limit registered funds for testing. Use 0 for no limit."
        required: true
        default: "0"
      fund_class_name:
        description: "Optional fund_class_name filter"
        required: false
        default: ""
      latest:
        description: "Use latest factsheet data for supported endpoints"
        required: true
        default: "true"
      start_date:
        description: "Factsheet start_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Factsheet end_date if latest=false, YYYY-MM-DD"
        required: false
        default: ""
      start_period:
        description: "Outstanding data start period, YYYYMM"
        required: false
        default: ""
      end_period:
        description: "Outstanding data end period, YYYYMM"
        required: false
        default: ""
      start_nav_date:
        description: "NAV start date, YYYY-MM-DD"
        required: true
        default: "2023-10-01"
      end_nav_date:
        description: "NAV end date, YYYY-MM-DD"
        required: true
        default: "2023-10-31"
      datasets:
        description: "Comma-separated datasets or all"
        required: true
        default: ""
      dataset_choice:
        description: "Choose one dataset if datasets is blank"
        required: true
        default: "02_profiles"
        type: choice
        options:
          - "all"
          - "01_amcs"
          - "02_profiles"
          - "03_specifications"
          - "04_mutual_fund_fees"
          - "05_involve_parties"
          - "06_factsheet_urls"
          - "07_ipos"
          - "08_benchmarks"
          - "09_subscription_redemption_minimums"
          - "10_subscription_redemption_periods"
          - "11_risk_spectrum"
          - "12_statistics"
          - "13_dividend_policy"
          - "14_fees"
          - "15_performance"
          - "16_asset_allocation"
          - "17_top5_holdings"
          - "18_outstanding_portfolio"
          - "19_portfolio_asset_type"
          - "20_nav_daily"
          - "21_dividend_history"
      max_pages:
        description: "Maximum pages per endpoint for test run. Use 0 for no limit."
        required: true
        default: "3"
      output_layout:
        description: "flat or latest-snapshot"
        required: true
        default: "latest-snapshot"
      output_group:
        description: "Optional output group folder, such as master, daily, or weekly"
        required: false
        default: ""
      write_curated:
        description: "Write combined curated CSV files"
        required: true
        default: "true"
      continue_on_error:
        description: "Continue when an endpoint returns an error"
        required: true
        default: "true"

jobs:
  fetch-sec-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sec.txt

      - name: Fetch SEC API data
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: |
          DATASETS="${{ inputs.datasets }}"
          if [ -z "$DATASETS" ]; then
            case "${{ inputs.dataset_choice }}" in
              all) DATASETS="all" ;;
              01_amcs) DATASETS="amcs" ;;
              02_profiles) DATASETS="profiles" ;;
              03_specifications) DATASETS="specifications" ;;
              04_mutual_fund_fees) DATASETS="mutual_fund_fees" ;;
              05_involve_parties) DATASETS="involve_parties" ;;
              06_factsheet_urls) DATASETS="factsheet_urls" ;;
              07_ipos) DATASETS="ipos" ;;
              08_benchmarks) DATASETS="benchmarks" ;;
              09_subscription_redemption_minimums) DATASETS="subscription_redemption_minimums" ;;
              10_subscription_redemption_periods) DATASETS="subscription_redemption_periods" ;;
              11_risk_spectrum) DATASETS="risk_spectrum" ;;
              12_statistics) DATASETS="statistics" ;;
              13_dividend_policy) DATASETS="dividend_policy" ;;
              14_fees) DATASETS="fees" ;;
              15_performance) DATASETS="performance" ;;
              16_asset_allocation) DATASETS="asset_allocation" ;;
              17_top5_holdings) DATASETS="top5_holdings" ;;
              18_outstanding_portfolio) DATASETS="outstanding_portfolio" ;;
              19_portfolio_asset_type) DATASETS="portfolio_asset_type" ;;
              20_nav_daily) DATASETS="nav_daily" ;;
              21_dividend_history) DATASETS="dividend_history" ;;
              *) DATASETS="profiles" ;;
            esac
          fi

          echo "Selected datasets: $DATASETS"

          python scripts/fetch_sec_data.py \
            --output-dir sec_output \
            --proj-id "${{ inputs.proj_id }}" \
            --fund-status "${{ inputs.fund_status }}" \
            --registered-only "${{ inputs.registered_only }}" \
            --registered-max-funds "${{ inputs.registered_max_funds }}" \
            --fund-class-name "${{ inputs.fund_class_name }}" \
            --latest "${{ inputs.latest }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --start-period "${{ inputs.start_period }}" \
            --end-period "${{ inputs.end_period }}" \
            --start-nav-date "${{ inputs.start_nav_date }}" \
            --end-nav-date "${{ inputs.end_nav_date }}" \
            --datasets "$DATASETS" \
            --max-pages "${{ inputs.max_pages }}" \
            --output-layout "${{ inputs.output_layout }}" \
            --output-group "${{ inputs.output_group }}" \
            --write-curated "${{ inputs.write_curated }}" \
            --continue-on-error "${{ inputs.continue_on_error }}"

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-csv-output
          path: sec_output/**/*.csv
          if-no-files-found: error
